name: CI

on:
  push:
    branches: [main]
    # Documentation-only changes cannot affect any build or test.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  # Manual runs select exactly the jobs needed instead of paying for the full
  # matrix: `jobs: termux` runs only the Termux container job, `jobs: all`
  # runs everything. Push/PR events ignore this input and keep path gating.
  workflow_dispatch:
    inputs:
      jobs:
        description: 'Comma-separated: all, audit, frontend, validate, headless, android, termux, features, gui, guards'
        required: true
        default: 'all'
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Classify the diff once (no external action) so expensive jobs can be
  # skipped when the change cannot affect them. `code` covers everything that
  # feeds the Rust artifacts or their license/provenance guards; `frontend`
  # covers the embedded web UI only; `termux` covers the native Android
  # toolchain, runtime loader and wrapper scripts. A manual dispatch with a
  # `jobs` subset bypasses path gating and runs exactly the requested jobs.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      audit: ${{ steps.filter.outputs.audit }}
      frontend: ${{ steps.filter.outputs.frontend }}
      validate: ${{ steps.filter.outputs.validate }}
      headless: ${{ steps.filter.outputs.headless }}
      android: ${{ steps.filter.outputs.android }}
      termux: ${{ steps.filter.outputs.termux }}
      features: ${{ steps.filter.outputs.features }}
      gui: ${{ steps.filter.outputs.gui }}
      guards: ${{ steps.filter.outputs.guards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify changed paths and requested jobs
        id: filter
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          JOBS_INPUT: ${{ inputs.jobs }}
        run: |
          set -euo pipefail
          emit() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            sel=${JOBS_INPUT:-all}
            for j in audit frontend validate headless android termux features gui guards; do
              case ",$sel," in
                *",all,"*|*",$j,"*) emit "$j" true ;;
                *) emit "$j" false ;;
              esac
            done
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
          else
            changed=$(git diff --name-only HEAD^ HEAD)
          fi
          printf '%s\n' "$changed" > /tmp/changed.txt

          code=false
          grep -qE '^(src/|tests/|examples/|scripts/|vendor/|licenses/|frontend/dist/|Cargo\.(toml|lock)|build\.rs|\.github/workflows/|models\.sha256\.json)' /tmp/changed.txt && code=true
          fe=false
          grep -q '^frontend/' /tmp/changed.txt && fe=true
          # The Termux job rebuilds natively inside termux-docker: needed when
          # the wrapper scripts, the vendored ORT toolchain, the build graph
          # or the code its self-test/smoke exercises change. Plain src/ churn
          # stays on the cheaper NDK cross-compile job.
          termux=false
          grep -qE '^(scripts/termux/|vendor/|\.github/workflows/|Cargo\.(toml|lock)|build\.rs|models\.sha256\.json|src/(main|lib|onnx_runtime)\.rs|src/(runtime|tts)/)' /tmp/changed.txt && termux=true
          emit audit true
          emit guards true
          emit frontend "$fe"
          emit validate "$code"
          emit headless "$code"
          emit android "$code"
          emit features "$code"
          emit gui "$code"
          emit termux "$termux"

  # Dedicated so dependency advisories fail fast instead of waiting behind
  # clippy + tests. Needs no native toolchain, frontend build or ALSA.
  audit:
    name: Audit dependencies
    needs: changes
    if: needs.changes.outputs.audit == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Prebuilt release binary with checksum verification instead of a
      # multi-minute `cargo install` on a cold cache. Keep this action recent:
      # each release pins the cargo-audit version it installs, and cargo-audit
      # older than 0.22 cannot parse the CVSS 4.0 vectors that RustSec now
      # publishes ("unsupported CVSS version: 4.0"). This pin ships 0.23.0.
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-audit
      # Gate on the `unmaintained` and `unsound` advisory categories. The
      # `yanked` check is intentionally NOT denied: the only remaining yanked
      # crate is core2, a wasm-only transitive dep of `image -> ravif -> rav1e`
      # (gui feature) with no non-yanked release. It is never compiled into a
      # Linux server artifact. The other yanked versions (wasm-bindgen/js-sys/
      # web-sys) were bumped in Cargo.lock; keep them non-yanked on every bump.
      # Per-advisory exceptions (e.g. the `gui`/GTK3 tree) live in
      # .cargo/audit.toml so any NEW advisory on a crate we depend on still
      # fails the build.
      - name: Run cargo audit
        run: cargo audit --deny unmaintained --deny unsound

  frontend:
    name: Web types, components, browser accessibility
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run test
        working-directory: frontend
      - run: npm run test:unit
        working-directory: frontend
      - run: npx playwright install --with-deps chromium firefox
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend

  validate:
    name: Format, Lint, Test
    needs: changes
    if: needs.changes.outputs.validate == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SONICBOOM_FRONTEND_PREBUILT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend once
        run: npm ci && npm run build
        working-directory: frontend

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo dependencies (validate)
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: validate-host-${{ hashFiles('vendor/**') }}
          cache-bin: 'false'
          save-if: ${{ github.event_name != 'pull_request' }}

      # The default `playback` feature (rodio/cpal) links against ALSA on Linux.
      # The WebGPU execution provider loads the Vulkan loader at runtime.
      - name: Install ALSA and the Vulkan loader
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libvulkan1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --all-targets

      # The `Test` step above is the authoritative behavioral run. libtest
      # exits 0 when a `-- <filter>` matches nothing, so a renamed or deleted
      # security-regression test can vanish silently; this single `--list`
      # invocation (never per-test) proves every required test still exists
      # exactly once. The required manifest lives in
      # scripts/ci/verify_regressions.ts and is unit-tested.
      - name: Verify security regression coverage
        run: |
          set -euo pipefail
          cargo test --locked --all-targets -- --list > /tmp/regression-tests.txt
          node --experimental-strip-types scripts/ci/verify_regressions.ts /tmp/regression-tests.txt
      - name: Test the regression manifest guard
        run: node --experimental-strip-types --test scripts/ci/test_verify_regressions.ts

  # Verify the headless network-server build (no ALSA dependency).
  build-headless:
    name: Build headless (no playback)
    needs: changes
    if: needs.changes.outputs.headless == 'true'
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '8'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Cache Cargo dependencies (headless)
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: headless-host-${{ hashFiles('vendor/**') }}
          cache-bin: 'false'
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Build release (headless server)
        run: cargo build --release --locked --no-default-features --features server

      - name: Clippy (headless server)
        run: cargo clippy --locked --no-default-features --features server --all-targets -- -D warnings

      - name: Test (headless server)
        run: cargo test --locked --no-default-features --features server

  # Cross-compilation validates the NDK ABI/build graph, not on-device inference.
  android-headless:
    name: Android ARM64 API-only (NDK, no runtime claims)
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: aarch64-linux-android
          components: rustfmt, clippy
      - name: Cache Cargo dependencies (Android)
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: android-aarch64-${{ hashFiles('vendor/**') }}
          cache-bin: 'false'
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Configure installed Android NDK
        run: |
          test -d "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=aarch64-linux-android28-clang" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=aarch64-linux-android28-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=aarch64-linux-android28-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=llvm-ar" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - name: Check Android feature graph
        run: |
          cargo tree --color never --locked --target aarch64-linux-android --no-default-features --features server,android-ort > android-tree.txt
          if grep -E '(^|[ │├└─])(alsa|cpal|rodio|tao|tray-icon|ksni|ash) v' android-tree.txt; then
            echo 'Unexpected desktop or GPU dependency' >&2
            exit 1
          fi
      - name: Build API-only Android executable
        run: cargo build --locked --target aarch64-linux-android --no-default-features --features server,android-ort --bin SonicBoom
      - name: Check optional Reverb-TTS provider
        run: cargo check --locked --target aarch64-linux-android --no-default-features --features server,android-ort,reverb-tts --bin SonicBoom
      # The archive is content-addressed by its pinned digest, so the cache
      # key never needs a version bump: a new ORT version means a new hash.
      - name: Cache the pinned ORT artifact
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime.aar
          key: onnxruntime-android-67397e4a970e75617f765d2015ceaf911917e1d822276cfb5792744e8085cbce
      - name: Validate official Android ORT artifact
        run: |
          # Maven Central rate-limits (429) runner IPs for minutes at a time.
          # The pinned digest makes a mirror safe: wrong bytes fail the check.
          if [ ! -f runtime.aar ]; then
            for mirror in \
              "https://repo.maven.apache.org/maven2" \
              "https://maven-central.storage-download.googleapis.com/maven2"; do
              if curl --fail --location --retry 3 --retry-delay 10 --retry-all-errors \
                  "$mirror/com/microsoft/onnxruntime/onnxruntime-android/1.24.3/onnxruntime-android-1.24.3.aar" \
                  -o runtime.aar; then
                break
              fi
            done
          fi
          echo '67397e4a970e75617f765d2015ceaf911917e1d822276cfb5792744e8085cbce  runtime.aar' | sha256sum -c -
          unzip -p runtime.aar jni/arm64-v8a/libonnxruntime.so > libonnxruntime.so
          readelf -h libonnxruntime.so | grep 'Machine:.*AArch64'
          readelf -d libonnxruntime.so | grep '\[libandroid.so\]'
          if readelf -d libonnxruntime.so | grep -E 'libc.so.6|libstdc\+\+.so|ld-linux'; then exit 1; fi
      - name: Clippy API-only Android
        run: cargo clippy --locked --target aarch64-linux-android --no-default-features --features server,android-ort --bin SonicBoom -- -D warnings

  # Real Termux userland (Bionic, pkg, $PREFIX, mksh /system/bin/sh) inside
  # termux-docker on a native ARM runner — no emulation. Executes install.sh,
  # the ONNX runtime self-test and the offline HTTP smoke test, none of which
  # the NDK cross-compile job can run. The container image is the aarch64
  # variant, so it needs an arm64 runner (free on public repos; on private
  # repos ARM runners are billed — keep it dispatch-selected there).
  termux:
    name: Termux ARM64 userland (container)
    needs: changes
    if: needs.changes.outputs.termux == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cargo registry, incremental target/ and the pinned ORT archive all
      # live under the checkout so a single actions/cache covers them.
      - name: Cache Termux build state
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .termux-ci
            target/release
          key: termux-aarch64-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            termux-aarch64-

      # The image entrypoint drops to the `system` user (uid 1000); the
      # workspace mount must be writable by it. Ownership is restored below
      # so the post-job cache archive and checkout cleanup still work.
      - name: Allow the container system user to write the workspace
        run: sudo chown -R 1000:1000 "$PWD"

      # The entrypoint re-execs through `env -i`, so Termux-side variables
      # are exported inside the command, not via `docker run -e`.
      # `pkg` picks a community mirror that can be minutes-slow from GitHub
      # egress (one run spent 38 min on downloads alone). Pin the Cloudflare
      # CDN mirror: mirror files are shell definitions that `pkg` sources
      # (MAIN/ROOT/X11/WEIGHT), selected via the `chosen_mirrors` link.
      - name: Install, build and smoke-test inside Termux
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            termux/termux-docker:aarch64 \
            /system/bin/sh -c '
              export SONICBOOM_TERMUX_CONTAINER=1 \
                     CARGO_HOME=/repo/.termux-ci/cargo \
                     XDG_CACHE_HOME=/repo/.termux-ci/xdg-cache \
                     CARGO_BUILD_JOBS=4
              mkdir -p "$PREFIX/etc/termux/mirrors" &&
              printf "%s\n" \
                "MAIN=\"https://packages-cf.termux.dev/apt/termux-main\"" \
                "ROOT=\"https://packages-cf.termux.dev/apt/termux-root\"" \
                "X11=\"https://packages-cf.termux.dev/apt/termux-x11\"" \
                "WEIGHT=10" \
                > "$PREFIX/etc/termux/mirrors/default" &&
              ln -sfn "$PREFIX/etc/termux/mirrors/default" "$PREFIX/etc/termux/chosen_mirrors" &&
              ./scripts/termux/install.sh &&
              pkg install -y python &&
              ./scripts/termux/test.sh --smoke-only
            '

      - name: Restore workspace ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$PWD"

  # Linux-compatible feature combinations beyond default/headless.
  feature-matrix:
    name: Feature matrix (${{ matrix.features }})
    needs: changes
    if: needs.changes.outputs.features == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      matrix:
        include:
          - features: ""
            args: --no-default-features
          - features: tiktools-plugin
            args: --no-default-features --features tiktools-plugin
          - features: server,reverb-tts
            args: --no-default-features --features server,reverb-tts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Cache Cargo dependencies (feature matrix)
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: features-${{ matrix.features }}-${{ hashFiles('vendor/**') }}
          cache-bin: 'false'
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Check ${{ matrix.features }}
        run: cargo check --locked ${{ matrix.args }} --all-targets
      # Tests for this feature set already run in `validate` (default features
      # include reverb-tts) and `build-headless` (server). Only check/clippy
      # are unique here; re-running cargo test duplicates both compilations.
      - name: Clippy server provider feature combinations
        if: contains(matrix.features, 'server')
        run: cargo clippy --locked ${{ matrix.args }} --all-targets -- -D warnings

  # The desktop tray on Linux is pure-Rust StatusNotifierItem (ksni): no GTK
  # system libraries are needed. Never reintroduce a GTK build dependency.
  build-gui:
    name: GUI tests and package (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.gui == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      KNF_STATIC_CRT: '0'
      SONICBOOM_FRONTEND_PREBUILT: '1'
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '8'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: sonicboom-linux-x86_64.tar.gz
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            asset: sonicboom-windows-x86_64.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test archive and checksum guards
        run: python -m unittest discover -s scripts/release -p "test_*.py"
      - name: Build frontend once
        run: npm ci && npm run build
        working-directory: frontend

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies (gui)
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: gui-${{ matrix.target }}-${{ hashFiles('vendor/**') }}
          cache-bin: 'false'
          save-if: ${{ github.event_name != 'pull_request' }}
          # Without this a failing later step (test, packaging) discards the
          # cache, so a job that has not yet gone green rebuilds every
          # dependency from scratch on every run. The Windows GUI job never
          # had a cache entry for that reason (~14 min of cold compiles).
          cache-on-failure: 'true'

      - name: Install ALSA development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libssl-dev libopus-dev pkg-config cmake clang g++ libvulkan1

      - name: Linux GUI graph must not contain glib
        if: runner.os == 'Linux'
        run: |
          set -e
          if cargo tree --locked --features gui --target x86_64-unknown-linux-gnu -i glib 2>/dev/null | grep -q 'glib v'; then
            echo "ERROR: glib present in Linux GUI dependency graph" >&2
            exit 1
          fi
          echo "OK: no glib in Linux GUI graph"

      # No per-OS clippy here: `validate` already runs clippy with the default
      # feature set (which includes `gui`), and `Test (GUI)` compiles every
      # target on this runner. Windows-specific clippy was ~7.5 min of pure
      # duplicate work on the critical path.

      # ort/copy-dylibs can copy only beside the profile root when Windows
      # symlinks are unavailable (cache and checkout live on different drives).
      # Tests/examples must still resolve those DLLs without disabling tests.
      - name: Make Cargo-copied DLLs available to Windows tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"${{ github.workspace }}/target/${{ matrix.target }}/debug" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'

      # `[profile.dev.package."*"]` builds every dependency at opt-level 3, so
      # debuginfo is pure cost here (PDB generation and linking dominate on
      # MSVC, and it bloats the cache). CI never opens a debugger.
      - name: Test (GUI)
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
        run: cargo test --locked --features gui --target ${{ matrix.target }}

      - name: Build release (GUI)
        run: cargo build --release --locked --features gui --target ${{ matrix.target }}

      - name: Package release binary (case-sensitive existence check)
        run: python scripts/release/package.py --target ${{ matrix.target }}

      - name: Verify native runtime, health and graceful shutdown
        run: python scripts/release/smoke.py dist/${{ matrix.asset }}

  supply-chain-guards:
    name: Supply-chain guards
    needs: changes
    if: needs.changes.outputs.guards == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: No credential stores committed
        run: |
          set -e
          if git ls-files | grep -x 'tokens.json'; then
            echo "ERROR: tokens.json must not be committed" >&2
            exit 1
          fi
          if git ls-files | grep -E '^\.env$'; then
            echo "ERROR: .env must not be committed" >&2
            exit 1
          fi

      - name: Actions must be SHA-pinned
        run: |
          set -e
          # Every step `uses:` referencing an external action must pin a full 40-hex SHA.
          if grep -rnE '^[[:space:]]+- uses: ' .github/workflows | grep -vE 'uses: [^ ]+@[0-9a-f]{40}( #|$)'; then
            echo "ERROR: found non-SHA-pinned action reference" >&2
            exit 1
          fi

      - name: Git dependencies must be rev-pinned
        run: |
          set -e
          if grep -n 'branch *=' Cargo.toml; then
            echo "ERROR: Cargo git dependencies must pin 'rev', not 'branch'" >&2
            exit 1
          fi
